[project]
name = "vigia"
version = "0.1.0"
description = "Self-healing docs — symbol extraction, staleness detection and auto-correction"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
